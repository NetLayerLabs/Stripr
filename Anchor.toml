[toolchain]
anchor_version = "1.2.0"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
stripr = "9wpHmYvuq7qrAuH4VV3LyC54d2VyTYFMfveMMph2nzZF"

[programs.mainnet]
stripr = "9wpHmYvuq7qrAuH4VV3LyC54d2VyTYFMfveMMph2nzZF"

[programs.localnet]
stripr = "9wpHmYvuq7qrAuH4VV3LyC54d2VyTYFMfveMMph2nzZF"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
setup-demo = "npx tsx scripts/setup-demo.ts"
seed-markets = "npx tsx scripts/seed-markets.ts"
seed-offers = "npx tsx scripts/seed-offers.ts"
open-mainnet-markets = "npx tsx scripts/open-mainnet-markets.ts"
reinvest-dividend = "npx tsx scripts/reinvest-dividend.ts"
snapshot-history = "npx tsx scripts/snapshot-history.ts"
test = "npx mocha --require tsx/cjs -t 1000000 'tests/**/*.ts'"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
# Port 8000 (the default gossip port) is taken on this machine.
gossip_port = 8200
dynamic_port_range = "8201-8260"

[[test.validator.account]]
address = "XsbEhLAtcf6HdfpFZ5xEMdqW8nfAvcsP5bdudRLJzJp"
filename = "tests/fixtures/aaplx-mint.json"
